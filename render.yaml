services:
  - type: web
    name: brubar-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci && npm run db:generate && npm run db:deploy
    startCommand: npm run api
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: brubar-db
          property: connectionString
      - key: WEB_ORIGIN
        value: https://brubar-web.onrender.com
      - key: NODE_ENV
        value: production

  - type: web
    name: brubar-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://brubar-api.onrender.com
    routes:
      - type: rewrite
        source: /.*
        destination: /index.html

databases:
  - name: brubar-db
    databaseName: brubar
    user: brubar
    region: oregon
    plan: free
